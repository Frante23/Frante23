<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Franco Oyarzo</title>
  <desc id="desc">Software Development, Infrastructure and Cybersecurity</desc>

  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="55%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0B3B75"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0%" stop-color="#58A6FF"/>
      <stop offset="100%" stop-color="#7EE787"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>

  <g opacity="0.13" stroke="#58A6FF" stroke-width="1">
    <path d="M0 55 H1200 M0 105 H1200 M0 155 H1200 M0 205 H1200 M0 255 H1200"/>
    <path d="M80 0 V320 M180 0 V320 M280 0 V320 M380 0 V320 M480 0 V320 M580 0 V320 M680 0 V320 M780 0 V320 M880 0 V320 M980 0 V320 M1080 0 V320"/>
  </g>

  <g fill="none" stroke="#58A6FF" stroke-width="2" opacity="0.48">
    <path d="M75 230 L150 175 L228 212 L305 135"/>
    <path d="M895 95 L970 145 L1050 105 L1120 165"/>
  </g>

  <g fill="#58A6FF" filter="url(#glow)">
    <circle cx="75" cy="230" r="5"/>
    <circle cx="150" cy="175" r="5"/>
    <circle cx="228" cy="212" r="5"/>
    <circle cx="305" cy="135" r="5"/>
    <circle cx="895" cy="95" r="5"/>
    <circle cx="970" cy="145" r="5"/>
    <circle cx="1050" cy="105" r="5"/>
    <circle cx="1120" cy="165" r="5"/>
  </g>

  <g font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle">
    <text x="600" y="124" fill="#F0F6FC" font-size="54" font-weight="700" letter-spacing="1">Franco Oyarzo</text>
    <rect x="355" y="148" width="490" height="3" rx="2" fill="url(#accent)"/>
    <text x="600" y="192" fill="#C9D1D9" font-size="21" font-weight="500">Software Development · Infrastructure · Cybersecurity</text>
    <text x="600" y="232" fill="#8B949E" font-size="16">Backend systems · Linux · Cloud · Secure software</text>
  </g>

  <g transform="translate(545 262)" font-family="monospace" font-size="14">
    <text x="0" y="0" fill="#7EE787">$</text>
    <text x="18" y="0" fill="#C9D1D9">build --deploy --secure</text>
    <rect x="214" y="-13" width="8" height="16" fill="#58A6FF" opacity="0.85"/>
  </g>
</svg>
