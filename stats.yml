name: Update GitHub Profile Stats

on:
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * *"

permissions:
  contents: write

concurrency:
  group: github-profile-stats
  cancel-in-progress: false

jobs:
  generate:
    name: Generate profile cards
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Create profile output directory
        run: mkdir -p profile

      - name: Generate GitHub stats
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2.0.2
        with:
          card: stats
          options: >-
            {"username":"${{ github.repository_owner }}",
            "show_icons":true,
            "include_all_commits":true,
            "rank_icon":"github",
            "hide_border":true,
            "theme":"github_dark"}
          path: profile/stats.svg
          token: ${{ secrets.GH_STATS_TOKEN }}
          core_version: 2.1.3
          fail_on_error: true

      - name: Generate top languages
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2.0.2
        with:
          card: top-langs
          options: >-
            {"username":"${{ github.repository_owner }}",
            "layout":"compact",
            "langs_count":8,
            "hide_border":true,
            "theme":"github_dark"}
          path: profile/top-langs.svg
          token: ${{ secrets.GH_STATS_TOKEN }}
          core_version: 2.1.3
          fail_on_error: true

      - name: Generate featured project card - mate1133
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2.0.2
        with:
          card: pin
          options: >-
            {"username":"${{ github.repository_owner }}",
            "repo":"mate1133-inscripcionepica",
            "hide_border":true,
            "theme":"github_dark"}
          path: profile/pin-mate1133.svg
          token: ${{ secrets.GH_STATS_TOKEN }}
          core_version: 2.1.3
          fail_on_error: true

      - name: Generate featured project card - tutorial
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2.0.2
        with:
          card: pin
          options: >-
            {"username":"${{ github.repository_owner }}",
            "repo":"tutorial-epico",
            "hide_border":true,
            "theme":"github_dark"}
          path: profile/pin-tutorial-epico.svg
          token: ${{ secrets.GH_STATS_TOKEN }}
          core_version: 2.1.3
          fail_on_error: true

      - name: Commit generated cards
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- profile/)" ]; then
            echo "No profile card changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/*.svg
          git commit -m "chore(profile): refresh GitHub statistics"
          git push
